<!DOCTYPE html>
<!--/*
  The sign-in page (ADR-005).

  Two things about this file are load-bearing rather than cosmetic:

  1. `th:action` and NOT `action`. Thymeleaf's Spring Security integration hooks the
     form's action attribute and injects the CSRF token as a hidden input. A plain
     `action="/login"` produces a form with no token, and the request is refused by
     CsrfFilter with a 403 before it ever reaches authentication. This is the single
     most common way a working login page is broken by a well-meaning edit.

  2. The field is named `email`, matching `usernameParameter("email")` in
     SecurityConfiguration. It is the email address that is also this application's
     username; the single word is used end to end so that the column, the entity,
     the record, and this input all name the same thing.

  The failure message is deliberately one sentence that does not say whether the
  address is registered. See AuthController.

  Signed-out and failed-sign-in notices are not flash attributes here — they arrive as
  query parameters Spring Security appends to the redirect, and AuthController turns them
  into booleans. They are passed to the same alert fragment the rest of the application
  uses, so a refusal reads the same wherever it appears.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/layout-auth :: page(~{::title}, ~{::section})}">
<head>
    <title>Sign in — Online Assignment Portal</title>
</head>
<body>

<section class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h4 mb-1">Online Assignment Portal</h1>
                <p class="text-body-secondary">Sign in to continue</p>

                <!--/* Present after a failed attempt. Spring Security redirects to /login?error. */-->
                <div th:replace="~{fragments/flash :: alert('danger',
                        ${signInFailed} ? 'Those credentials were not accepted. Please try again.' : null)}"></div>

                <!--/* Present after a successful sign-out. Spring Security redirects to /login?logout. */-->
                <div th:replace="~{fragments/flash :: alert('success',
                        ${signedOut} ? 'You have been signed out.' : null)}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <!--/*
                          autocomplete="username" so a password manager fills it: this IS the
                          username, whatever the field is called. The `type` is `text` rather
                          than `email` because HTML5 validation would block a non-address before
                          the server sees it, and the server is where the decision belongs —
                          client-side checks are a convenience and never a control (CLAUDE.md §7).
                        */-->
                        <input type="text"
                               class="form-control"
                               id="email"
                               name="email"
                               autocomplete="username"
                               autofocus
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               autocomplete="current-password"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Sign in</button>
                </form>

            </div>
        </div>
    </div>
</section>

</body>
</html>
