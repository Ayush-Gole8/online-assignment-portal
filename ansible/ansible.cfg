# Ansible configuration for provisioning the Online Assignment Portal deployment
# host. Scoped to this directory: run ansible-playbook from `ansible/`, or pass the
# inventory explicitly as the project's canonical command does
# (docs/operations/ansible.md §7).

[defaults]
inventory = inventory/staging.ini
roles_path = roles
retry_files_enabled = False
# YAML output makes a converge run readable — the point of the "run it twice"
# demonstration is to SEE that the second run changes nothing.
stdout_callback = yaml
nocows = True

# Host key checking stays ON, deliberately and for the same reason the CD pipeline
# keeps it on (docs/operations/docker-cd.md §4): accepting an unknown host key on
# every connection makes a man in the middle indistinguishable from the deployment
# target. Provision the controller's known_hosts out of band; the first run against
# an unprovisioned controller fails with a host-key error, which is correct.
host_key_checking = True

[privilege_escalation]
# The connection user signs in unprivileged and escalates with sudo for the apt,
# systemd, and file tasks that need root. The playbook sets `become: true`; this
# only names the method.
become = False
become_method = sudo
become_ask_pass = False
