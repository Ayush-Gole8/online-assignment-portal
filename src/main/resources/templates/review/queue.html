<!DOCTYPE html>
<!--/*
  The reviewer's queue: submissions waiting for a decision (FR-16).

  `submissions` is a Page<SubmissionSummary> — read models, never Submission entities.
  The page contains only rows still in SUBMITTED: the query in SubmissionRepository
  filters by status, so an already-decided submission is never handed to this page and
  cannot be rendered as if it were waiting. The paging is the same filtered query with a
  limit on it, so it cannot widen the result either.

  Reaching this page is restricted by SecurityConfiguration: /review/** requires REVIEWER
  or ADMIN. The page renders the same for both, because an ADMIN's decision is recorded
  exactly as a REVIEWER's.

  THE EMPTY STATE MATTERS MORE HERE THAN ANYWHERE ELSE. A reviewer's queue is empty every
  time it has been worked through to the end, which is the normal, healthy state — so it
  is stated as a fact rather than shown as an empty table, which reads as a failure to
  load.

  Model attributes:
    currentUser  CurrentUserView          — for the navigation fragment
    submissions  Page<SubmissionSummary>

  `id="review-queue"` names this page for the browser suite, so "the queue has loaded" is
  asserted against the queue rather than against the word "Review queue" appearing in the
  document title — which the reviewer detail page's own title also contains.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
    <title>Review queue — Online Assignment Portal</title>
</head>
<body>

<section id="review-queue">
    <h1 class="h3">Review queue</h1>
    <p class="text-body-secondary">Submissions waiting for a decision, longest waiting first.</p>

    <div class="card" th:if="${submissions.numberOfElements == 0}">
        <div class="card-body text-center py-5">
            <p class="mb-0">Nothing is waiting for review.</p>
        </div>
    </div>

    <div class="card" th:unless="${submissions.numberOfElements == 0}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <caption class="visually-hidden">Submissions awaiting a decision, oldest first</caption>
                <thead>
                <tr>
                    <th scope="col">Title</th>
                    <th scope="col">Course</th>
                    <th scope="col">File</th>
                    <th scope="col">Submitted</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="submission : ${submissions}">
                    <td>
                        <!--/* The link carries only the identifier; the reviewer's detail handler is
                             what authorises the request, by role at the route. */-->
                        <a th:href="@{/review/submissions/{id}(id=${submission.id})}"
                           th:text="${submission.title}">Coursework</a>
                    </td>
                    <td th:text="${submission.courseCode}">CS101</td>
                    <td th:text="${submission.originalFileName}">essay.pdf</td>
                    <td class="text-body-secondary" th:text="${submission.submittedOn()}">1 Oct 2026, 14:45 IST</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <nav th:replace="~{fragments/pagination :: paginate(${submissions}, '/review/queue')}"></nav>
    </div>
</section>

</body>
</html>
