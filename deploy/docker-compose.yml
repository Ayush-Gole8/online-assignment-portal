# ===========================================================================
# Local development composition — MySQL 8.4 for the Online Assignment Portal.
#
# Scope: LOCAL DEVELOPMENT ONLY.
#   This file runs the database a developer needs on their own machine. It is
#   not the deployment composition: ADR-006 governs that topology, and the
#   deployment stack runs the application in a container alongside the database
#   with no database port published at all.
#
#   The one deliberate difference here is the port publication below, bound to
#   loopback only. A developer runs the application from the host
#   (`./mvnw spring-boot:run`), so the host must be able to reach MySQL. Binding
#   to 127.0.0.1 rather than 0.0.0.0 keeps the database off every other network
#   interface. See ADR-006, "Local development clarification".
#
# Secrets:
#   No credential is written in this file. Every value comes from the environment,
#   loaded by Compose from `.env` in the directory where you run the command
#   (copy `.env.example` to `.env`). `.env` is git-ignored.
#
# Usage (from the repository root):
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml ps
#   docker compose -f deploy/docker-compose.yml down        # keeps data
#   docker compose -f deploy/docker-compose.yml down -v     # DELETES data
# ===========================================================================

name: online-assignment-portal

services:

  db:
    image: mysql:8.4
    container_name: assignment-portal-db

    # Restart on crash and on daemon restart, but stay down if an operator stopped
    # it deliberately. Right for a development database: it survives a reboot
    # without fighting a manual `docker compose stop`.
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-assignment_portal}
      MYSQL_USER: ${DB_USERNAME:-assignment_portal}
      # `:?` makes Compose abort with this message rather than start a database
      # with an empty or default password. A missing secret must fail loudly.
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and fill it in.}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is not set. Copy .env.example to .env and fill it in.}

    ports:
      # Loopback only. See the scope note above.
      - "127.0.0.1:${DB_PORT:-3306}:3306"

    volumes:
      # Named volume, not a bind mount and not the container filesystem. Data
      # survives `docker compose down` and image upgrades (ADR-004). Only
      # `down -v` destroys it.
      - mysql-data:/var/lib/mysql

    healthcheck:
      # `$$` escapes the variable so Compose passes it through and the container's
      # shell expands it from the container's own environment — the password never
      # appears in this file.
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      # MySQL initialises its data directory on first start; that takes longer than
      # a normal start. Without this, the first health check reports unhealthy
      # before the server is even up.
      start_period: 40s

volumes:
  mysql-data:
    # An explicit, predictable name so `docker volume ls` and backup scripts do not
    # depend on the Compose project prefix.
    name: assignment-portal-mysql-data
