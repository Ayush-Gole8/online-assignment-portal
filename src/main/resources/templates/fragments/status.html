<!DOCTYPE html>
<!--/*
  The status badge, in one place because four pages render it.

  Used as:  <span th:replace="~{fragments/status :: badge(${submission.status})}"></span>

  The class is derived from the status rather than chosen by an if/else chain, so adding a
  fourth status later shows up as a missing colour instead of silently rendering as one of
  the three existing outcomes. The colours themselves live in portal.css — this file
  decides which class, the stylesheet decides what it looks like.

  `#strings.toLowerCase` is applied to `name()` explicitly. An enum rendered without
  `.name()` goes through `toString()`, and `.toString()` on an enum is not the same thing
  as `.name()` in general — it happens to be here, but a badge that depends on that
  coincidence would break the moment somebody added a `toString()` override.

  The text is the enum name itself, so the badge reads SUBMITTED / APPROVED / REJECTED —
  the same vocabulary the database stores and the route rules use.

  `data-status` carries the same value as an attribute, because the text is not enough to
  identify the badge. This fragment repeats once per row in a table, so it cannot carry a
  fixed id — but a reader that finds the badge inside a row needs to know WHICH outcome it
  is without depending on the CSS class that happens to colour it. The class is styling;
  `data-status` is the state, and the browser suite reads the state.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fragment</title>
</head>
<body>

<span th:fragment="badge(status)"
      class="badge status"
      th:classappend="${'status-' + #strings.toLowerCase(status.name())}"
      th:attr="data-status=${status.name()}"
      th:text="${status}">SUBMITTED</span>

</body>
</html>
