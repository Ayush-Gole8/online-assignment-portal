# Runtime configuration for the Online Assignment Portal.
#
# Rules (CLAUDE.md §8):
#   * This file holds DEFAULTS ONLY. Every secret arrives from the environment.
#   * Placeholders resolve in the order: environment variable -> default shown here.
#   * No password, token, or credential is ever written in this file.
#
# The same artefact is promoted between environments; nothing is rebuilt per environment.

spring:
  application:
    name: online-assignment-portal

  config:
    # Spring Boot does not read `.env` on its own — only Docker Compose does. Importing it
    # here makes the documented local workflow work: one file, `.env`, supplies the same
    # variable names to both the application and the Compose database.
    #
    # `optional:` means the file is not required. In CI and in deployed environments the
    # values arrive as real environment variables, which take precedence over this file.
    # `.env` is git-ignored; `.env.example` documents the variable names only.
    import:
      - optional:file:.env[.properties]

  datasource:
    # DB_URL, DB_USERNAME and DB_PASSWORD are supplied by the environment.
    # The defaults exist so a developer can start against the local Compose MySQL
    # (deploy/docker-compose.yml) without exporting anything. DB_PASSWORD deliberately
    # has NO default: a missing password must fail fast, never fall back to empty.
    url: ${DB_URL:jdbc:mysql://localhost:3306/assignment_portal}
    username: ${DB_USERNAME:assignment_portal}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Hibernate NEVER owns the schema. Flyway creates and evolves it, and Hibernate
    # only verifies that the entities match what the migrations produced (ADR-003).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Store and read timestamps in UTC regardless of host or JVM time zone.
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations are forward-only. Never let Flyway silently repair or re-baseline a
    # schema that already has history (ADR-003).
    baseline-on-migrate: false
    validate-on-migrate: true

  # Uploads are capped at 10 MB in the MVP (FR-7). Rejecting oversized multipart requests
  # here stops them before a byte reaches application code.
  #
  # The two limits are deliberately NOT the same number. `max-file-size` is the real
  # limit and matches FileValidationService.MAX_FILE_SIZE_BYTES exactly. `max-request-size`
  # is larger, because it caps the whole multipart envelope — the boundaries, the form
  # fields, and the file together. Setting it to exactly 10MB would reject a legitimate
  # 10MB file on the strength of the few hundred bytes of envelope around it, and the user
  # would be told their file was too large when it was not.
  #
  # Both are a backstop, not the control: FileValidationService enforces the same limit in
  # application code, where it can produce a message. The container's limit exists so that
  # an oversized request is refused without being buffered (CLAUDE.md §7 rule 4).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# ---------------------------------------------------------------------------
# Operability — the delivery pipeline's health-check and rollback stages depend
# on these (FR-25).
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Only `health` is published. `env`, `configprops` and `beans` would expose
        # configuration and must never be internet-reachable.
        include: health
  endpoint:
    health:
      # Report status only. Details can include database host names and driver versions.
      show-details: never

server:
  port: ${APP_PORT:8080}
  # Do not advertise the container/server technology in responses.
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

  servlet:
    session:
      # Session lifetime. ADR-005's follow-up requires the timeout and the cookie
      # attributes to be configuration rather than hard-coded, so that local and
      # deployed environments can differ without a rebuild.
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        # Not readable by JavaScript. The defence that a token in localStorage would
        # not have: XSS can act as the user, but it cannot exfiltrate the session id.
        http-only: true
        # Not sent on cross-site navigations, which is the browser-side half of the
        # CSRF story. The server-side half is the token check, which stays enabled.
        same-site: lax
        # Must be true anywhere the site is served over HTTPS. Defaults to false so
        # that local development over http:// works; a deployed environment sets
        # SESSION_COOKIE_SECURE=true. A `Secure` cookie is not sent over plain HTTP,
        # so turning this on locally would silently break sign-in.
        secure: ${SESSION_COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
app:
  storage:
    # Root directory for uploaded artefacts. Bytes live on a persistent volume and
    # only metadata lives in MySQL (ADR-004). The default is a local, git-ignored
    # directory so a developer needs no configuration; deployed environments set
    # UPLOAD_STORAGE_PATH to the mounted volume.
    #
    # Bound by storage.StorageProperties and consumed by storage.StorageService. This
    # path is NOT servable: nothing maps it to a URL, and no static-resource handler
    # points at it, so an artefact can only be reached through an endpoint that checks
    # who is asking. `src/main/resources/static` is where servable files live and where
    # uploads must never be written (CLAUDE.md §7 rule 7).
    root: ${UPLOAD_STORAGE_PATH:./uploads}

  seed:
    # Whether DevelopmentUserSeeder may create the demo accounts. It is also gated on
    # the `dev` profile, so this being true is not sufficient on its own — the bean
    # does not exist under any other profile.
    #
    # Two gates rather than one, and the default is `false`: seeding creates
    # credentials, and the cost of an accidental seed is a predictable account in an
    # environment nobody expected. The passwords themselves have no default anywhere
    # — each account is skipped unless its own environment variable is set.
    #
    # Local development:  SPRING_PROFILES_ACTIVE=dev APP_SEED_ENABLED=true ./mvnw spring-boot:run
    enabled: ${APP_SEED_ENABLED:false}

logging:
  level:
    root: INFO
    com.vit.assignmentportal: INFO
