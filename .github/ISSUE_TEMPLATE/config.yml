# Issue template configuration
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/Ayush-Gole8/online-assignment-portal/security/advisories/new
    about: Do NOT open a public issue. Report vulnerabilities privately — see SECURITY.md.

  - name: Question or discussion
    url: https://github.com/Ayush-Gole8/online-assignment-portal/discussions
    about: Ask a question or discuss an approach before writing code.

  - name: Contribution workflow
    url: https://github.com/Ayush-Gole8/online-assignment-portal/blob/main/CONTRIBUTING.md
    about: Branch naming, commit conventions, and the definition of done.
