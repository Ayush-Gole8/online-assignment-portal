# ===========================================================================
# Staging inventory — the deployment host(s) for the staging environment.
#
# The group is named `staging`, which is what binds group_vars/staging.yml to
# these hosts. Replace the placeholder below with the real host before running;
# ansible_host has no sensible default, for the same reason DEPLOY_HOST has none
# in the CD pipeline — a deployment aimed at the wrong host by an unset value is
# the failure the missing default prevents (docs/operations/docker-cd.md §4).
#
# The controller's known_hosts must already hold this host's key: host key
# checking is NOT disabled (ansible.cfg). Provision it out of band and verify the
# fingerprint against the host itself.
# ===========================================================================

[staging]
assignment-portal-staging ansible_host=CHANGE_ME.staging.example.com

[staging:vars]
# The unprivileged account Ansible connects as; it escalates to root with sudo
# (see ansible.cfg and site.yml `become: true`). It must have passwordless sudo,
# or the run is invoked with --ask-become-pass.
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
