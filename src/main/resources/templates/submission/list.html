<!DOCTYPE html>
<!--/*
  The student's own submissions.

  `submissions` is a Page<SubmissionSummary> — read models, never Submission entities.
  The entity carries a studentId and a storedFileName; a read model carries what is
  being shown and nothing else (docs/architecture/application-structure.md §6).

  The list contains only the signed-in student's rows, and that is enforced by the query
  in SubmissionRepository rather than by a filter here. A template cannot leak a row it
  was never given. The paging is the same query with a limit on it, so it cannot widen the
  result either.

  THE EMPTY STATE IS A SENTENCE AND A WAY FORWARD, not an empty table. A table with
  headers and no rows reads as a loading failure, and a reader who has handed nothing in
  needs the upload link more than they need column headings.

  Model attributes:
    currentUser  CurrentUserView          — for the navigation fragment
    submissions  Page<SubmissionSummary>  — one page of the student's own work
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
    <title>My submissions — Online Assignment Portal</title>
</head>
<body>

<section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h1 class="h3 mb-0">My submissions</h1>
        <a class="btn btn-primary" th:href="@{/submissions/new}">Upload a submission</a>
    </div>

    <!--/* numberOfElements, not #lists.isEmpty: a Spring Data Page is not a List, and the
         count it carries is the page's size rather than the whole result set. */-->
    <div class="card mt-3" th:if="${submissions.numberOfElements == 0}">
        <div class="card-body text-center py-5">
            <p class="mb-3">You have not submitted anything yet.</p>
            <a class="btn btn-primary" th:href="@{/submissions/new}">Upload your first submission</a>
        </div>
    </div>

    <div class="card mt-3" th:unless="${submissions.numberOfElements == 0}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <caption class="visually-hidden">Your submissions, most recent first</caption>
                <thead>
                <tr>
                    <th scope="col">Title</th>
                    <th scope="col">Course</th>
                    <th scope="col">File</th>
                    <th scope="col">Status</th>
                    <th scope="col">Submitted</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="submission : ${submissions}">
                    <td>
                        <!--/* The link carries only the identifier, and the detail handler looks the
                             row up BY OWNER. Changing this value in the address bar to somebody
                             else's identifier produces a 404, not their submission. */-->
                        <a th:href="@{/submissions/{id}(id=${submission.id})}"
                           th:text="${submission.title}">Coursework</a>
                    </td>
                    <td th:text="${submission.courseCode}">CS101</td>
                    <!--/* The name the student's own machine used. Display only: the file on the
                         volume is stored under a generated identifier. */-->
                    <td th:text="${submission.originalFileName}">essay.pdf</td>
                    <td>
                        <span th:replace="~{fragments/status :: badge(${submission.status})}">SUBMITTED</span>
                    </td>
                    <td class="text-body-secondary" th:text="${submission.submittedOn()}">1 Oct 2026, 09:15 UTC</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
        <nav th:replace="~{fragments/pagination :: paginate(${submissions}, '/submissions')}"></nav>
        <p class="text-body-secondary small mb-0"
           th:if="${submissions.totalElements > 0}"
           th:text="${submissions.totalElements == 1 ? '1 submission'
                                                      : submissions.totalElements + ' submissions'}">
            3 submissions
        </p>
    </div>
</section>

</body>
</html>
